<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="930" viewBox="0 0 680 620" role="img">
<title>DNAT distribuído: execução e pagamento</title>
<desc>O comprador trava o pagamento em escrow na Ethereum, o contrato sorteia uma CVM executora por stake, ela busca blocos cifrados nos peers A e B, recebe as partes da chave do comitê sorteado após verificação no ledger, executa sem rede e publica um recibo que divide o escrow entre donos, peers fornecedores, executor e comitê.</desc>
<style>
text{font-family:Helvetica,Arial,sans-serif}
.t{font-size:14px;fill:#2C2C2A}.th{font-size:14px;font-weight:600;fill:#2C2C2A}.ts{font-size:12px;fill:#5F5E5A}
.box{fill:#FFFFFF;stroke:#B4B2A9}
.c-purple>rect,rect.c-purple{fill:#EEEDFE;stroke:#534AB7}.c-purple .th{fill:#3C3489}.c-purple .ts{fill:#534AB7}
.c-teal>rect,rect.c-teal{fill:#E1F5EE;stroke:#0F6E56}.c-teal .th{fill:#085041}.c-teal .ts{fill:#0F6E56}
.c-gray>rect,rect.c-gray{fill:#F1EFE8;stroke:#5F5E5A}.c-gray .th{fill:#444441}.c-gray .ts{fill:#5F5E5A}
.c-green>rect,rect.c-green{fill:#EAF3DE;stroke:#3B6D11}.c-green .th{fill:#27500A}.c-green .ts{fill:#3B6D11}
.c-coral>circle{fill:#FAECE7;stroke:#993C1D}.c-coral .th{fill:#712B13}
.flow{stroke:#D85A30;stroke-width:2;fill:none}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="680" height="620" fill="#FFFFFF"/>
<g class="c-gray"><rect x="30" y="34" width="130" height="60" rx="8" stroke-width="0.5"/><text class="th" x="95" y="54" text-anchor="middle" dominant-baseline="central">Comprador</text><text class="ts" x="95" y="74" text-anchor="middle" dominant-baseline="central">Assina e paga</text></g>
<g class="c-purple"><rect x="190" y="24" width="460" height="80" rx="12" stroke-width="0.5"/><text class="th" x="420" y="50" text-anchor="middle" dominant-baseline="central">Ethereum L1: pedido e escrow</text><text class="ts" x="420" y="72" text-anchor="middle" dominant-baseline="central">Valor travado; executor sorteado por stake</text></g>
<g class="c-gray"><rect x="30" y="150" width="150" height="230" rx="12" stroke-width="0.5"/><text class="th" x="105" y="172" text-anchor="middle" dominant-baseline="central">Rede IPFS (D3)</text><text class="ts" x="105" y="190" text-anchor="middle" dominant-baseline="central">Blocos cifrados</text></g>
<g class="c-green"><rect x="45" y="208" width="120" height="40" rx="8" stroke-width="0.5"/><text class="th" x="105" y="228" text-anchor="middle" dominant-baseline="central">Peer A</text></g>
<g class="c-green"><rect x="45" y="260" width="120" height="40" rx="8" stroke-width="0.5"/><text class="th" x="105" y="280" text-anchor="middle" dominant-baseline="central">Peer B</text></g>
<rect class="box" x="45" y="312" width="120" height="40" rx="8" stroke-width="0.5"/><text class="t" x="105" y="332" text-anchor="middle" dominant-baseline="central">Peer C</text>
<g class="c-teal"><rect x="215" y="150" width="250" height="230" rx="12" stroke-width="0.5"/><text class="th" x="340" y="172" text-anchor="middle" dominant-baseline="central">CVM executora (D5)</text><text class="ts" x="340" y="190" text-anchor="middle" dominant-baseline="central">Sorteada, atestada, uso único</text></g>
<rect class="box" x="235" y="204" width="210" height="36" rx="6" stroke-width="0.5"/><text class="t" x="340" y="222" text-anchor="middle" dominant-baseline="central">Boot medido, chave nova</text>
<rect class="box" x="235" y="246" width="210" height="36" rx="6" stroke-width="0.5"/><text class="t" x="340" y="264" text-anchor="middle" dominant-baseline="central">Decifra só aqui dentro</text>
<rect class="box" x="235" y="288" width="210" height="36" rx="6" stroke-width="0.5"/><text class="t" x="340" y="306" text-anchor="middle" dominant-baseline="central">Container sem rede</text>
<rect class="box" x="235" y="330" width="210" height="36" rx="6" stroke-width="0.5"/><text class="t" x="340" y="348" text-anchor="middle" dominant-baseline="central">Cifra resultado e morre</text>
<g class="c-purple"><rect x="500" y="150" width="150" height="230" rx="12" stroke-width="0.5"/><text class="th" x="575" y="172" text-anchor="middle" dominant-baseline="central">Comitê de chaves</text><text class="ts" x="575" y="190" text-anchor="middle" dominant-baseline="central">Sorteado, t de N</text></g>
<rect class="box" x="515" y="208" width="120" height="40" rx="8" stroke-width="0.5"/><text class="t" x="575" y="228" text-anchor="middle" dominant-baseline="central">Nó de chave 1</text>
<rect class="box" x="515" y="260" width="120" height="40" rx="8" stroke-width="0.5"/><text class="t" x="575" y="280" text-anchor="middle" dominant-baseline="central">Nó de chave 2</text>
<rect class="box" x="515" y="312" width="120" height="40" rx="8" stroke-width="0.5"/><text class="t" x="575" y="332" text-anchor="middle" dominant-baseline="central">Nó de chave 3</text>
<g class="c-purple"><rect x="30" y="430" width="620" height="150" rx="12" stroke-width="0.5"/><text class="th" x="340" y="454" text-anchor="middle" dominant-baseline="central">Ethereum L1: recibo e liquidação</text><text class="ts" x="340" y="472" text-anchor="middle" dominant-baseline="central">Recibo assinado pela CVM libera o escrow</text></g>
<g class="c-green"><rect x="46" y="494" width="108" height="60" rx="8" stroke-width="0.5"/><text class="th" x="100" y="514" text-anchor="middle" dominant-baseline="central">Dono dataset</text><text class="ts" x="100" y="534" text-anchor="middle" dominant-baseline="central">Preço do dado</text></g>
<g class="c-green"><rect x="166" y="494" width="108" height="60" rx="8" stroke-width="0.5"/><text class="th" x="220" y="514" text-anchor="middle" dominant-baseline="central">Desenvolvedor</text><text class="ts" x="220" y="534" text-anchor="middle" dominant-baseline="central">Preço da app</text></g>
<g class="c-green"><rect x="286" y="494" width="108" height="60" rx="8" stroke-width="0.5"/><text class="th" x="340" y="514" text-anchor="middle" dominant-baseline="central">Peers A e B</text><text class="ts" x="340" y="534" text-anchor="middle" dominant-baseline="central">Bônus por bytes</text></g>
<g class="c-green"><rect x="406" y="494" width="108" height="60" rx="8" stroke-width="0.5"/><text class="th" x="460" y="514" text-anchor="middle" dominant-baseline="central">Executor</text><text class="ts" x="460" y="534" text-anchor="middle" dominant-baseline="central">Bônus e stake</text></g>
<g class="c-green"><rect x="526" y="494" width="108" height="60" rx="8" stroke-width="0.5"/><text class="th" x="580" y="514" text-anchor="middle" dominant-baseline="central">Comitê</text><text class="ts" x="580" y="534" text-anchor="middle" dominant-baseline="central">Fatia do job</text></g>
<line class="flow" x1="162" y1="64" x2="186" y2="64" marker-end="url(#arrow)"/>
<line class="flow" x1="340" y1="106" x2="340" y2="146" marker-end="url(#arrow)"/>
<line class="flow" x1="167" y1="228" x2="211" y2="228" marker-end="url(#arrow)"/>
<line class="flow" x1="167" y1="280" x2="211" y2="280" marker-end="url(#arrow)"/>
<line class="flow" x1="498" y1="254" x2="469" y2="254" marker-end="url(#arrow)"/>
<line class="flow" x1="575" y1="148" x2="575" y2="108" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<line class="flow" x1="340" y1="382" x2="340" y2="426" marker-end="url(#arrow)"/>
<g class="c-coral"><circle cx="174" cy="40" r="10" stroke-width="0.5"/><text class="th" x="174" y="40" text-anchor="middle" dominant-baseline="central">1</text></g>
<g class="c-coral"><circle cx="358" cy="126" r="10" stroke-width="0.5"/><text class="th" x="358" y="126" text-anchor="middle" dominant-baseline="central">2</text></g>
<g class="c-coral"><circle cx="189" cy="254" r="10" stroke-width="0.5"/><text class="th" x="189" y="254" text-anchor="middle" dominant-baseline="central">3</text></g>
<g class="c-coral"><circle cx="483" cy="232" r="10" stroke-width="0.5"/><text class="th" x="483" y="232" text-anchor="middle" dominant-baseline="central">4</text></g>
<g class="c-coral"><circle cx="358" cy="404" r="10" stroke-width="0.5"/><text class="th" x="358" y="404" text-anchor="middle" dominant-baseline="central">5</text></g>
<g class="c-coral"><circle cx="626" cy="454" r="10" stroke-width="0.5"/><text class="th" x="626" y="454" text-anchor="middle" dominant-baseline="central">6</text></g>
<rect class="c-purple" x="30" y="599" width="10" height="10" rx="2" stroke-width="0.5"/><text class="ts" x="46" y="604" dominant-baseline="central">Blockchain e chaves</text>
<rect class="c-teal" x="195" y="599" width="10" height="10" rx="2" stroke-width="0.5"/><text class="ts" x="211" y="604" dominant-baseline="central">CVM atestada</text>
<rect class="c-green" x="310" y="599" width="10" height="10" rx="2" stroke-width="0.5"/><text class="ts" x="326" y="604" dominant-baseline="central">Recebe pagamento</text>
<line class="flow" x1="455" y1="604" x2="471" y2="604"/><text class="ts" x="477" y="604" dominant-baseline="central">Fluxo</text>
<line class="flow" x1="530" y1="604" x2="546" y2="604" stroke-dasharray="5 4"/><text class="ts" x="552" y="604" dominant-baseline="central">Verificação</text>
</svg>
