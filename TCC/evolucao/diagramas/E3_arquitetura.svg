<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="915" viewBox="0 0 680 610" role="img">
<title>DNAT distribuído: arquitetura e pedido de execução</title>
<desc>O comprador envia o pedido a um validador público da Ethereum, os validadores entram em consenso, o contrato registra o pedido com escrow e sorteia comitê e executor. Embaixo, os papéis da rede, todos preenchidos por sorteio ponderado por stake, e o comitê de verificação formado por todos os nós remunerados.</desc>
<style>
text{font-family:Helvetica,Arial,sans-serif}
.t{font-size:14px;fill:#2C2C2A}.th{font-size:14px;font-weight:600;fill:#2C2C2A}.ts{font-size:12px;fill:#5F5E5A}
.box{fill:#FFFFFF;stroke:#B4B2A9}
.c-purple>rect,.c-purple>circle,rect.c-purple{fill:#EEEDFE;stroke:#534AB7}.c-purple .th{fill:#3C3489}.c-purple .ts{fill:#534AB7}
.c-teal>rect,rect.c-teal{fill:#E1F5EE;stroke:#0F6E56}.c-teal .th{fill:#085041}.c-teal .ts{fill:#0F6E56}
.c-gray>rect,rect.c-gray{fill:#F1EFE8;stroke:#5F5E5A}.c-gray .th{fill:#444441}.c-gray .ts{fill:#5F5E5A}
.c-coral>circle{fill:#FAECE7;stroke:#993C1D}.c-coral .th{fill:#712B13}
.flow{stroke:#D85A30;stroke-width:2;fill:none}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="680" height="610" fill="#FFFFFF"/>
<g class="c-gray"><rect x="30" y="24" width="150" height="56" rx="8" stroke-width="0.5"/><text class="th" x="105" y="44" text-anchor="middle" dominant-baseline="central">Comprador</text><text class="ts" x="105" y="62" text-anchor="middle" dominant-baseline="central">Carteira própria</text></g>
<g class="c-gray"><rect x="265" y="24" width="150" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340" y="44" text-anchor="middle" dominant-baseline="central">Dono do dataset</text><text class="ts" x="340" y="62" text-anchor="middle" dominant-baseline="central">Define a política</text></g>
<g class="c-gray"><rect x="500" y="24" width="150" height="56" rx="8" stroke-width="0.5"/><text class="th" x="575" y="44" text-anchor="middle" dominant-baseline="central">Desenvolvedor</text><text class="ts" x="575" y="62" text-anchor="middle" dominant-baseline="central">Envia o código</text></g>
<g class="c-purple"><rect x="30" y="118" width="620" height="180" rx="14" stroke-width="0.5"/><text class="th" x="340" y="140" text-anchor="middle" dominant-baseline="central">Ethereum L1 (D1)</text><text class="ts" x="340" y="158" text-anchor="middle" dominant-baseline="central">Validadores públicos, prova de stake</text></g>
<rect class="box" x="50" y="176" width="125" height="44" rx="8" stroke-width="0.5"/><text class="t" x="112" y="198" text-anchor="middle" dominant-baseline="central">Validador</text>
<rect class="box" x="200" y="176" width="125" height="44" rx="8" stroke-width="0.5"/><text class="t" x="262" y="198" text-anchor="middle" dominant-baseline="central">Validador</text>
<rect class="box" x="350" y="176" width="125" height="44" rx="8" stroke-width="0.5"/><text class="t" x="412" y="198" text-anchor="middle" dominant-baseline="central">Validador</text>
<rect class="box" x="500" y="176" width="125" height="44" rx="8" stroke-width="0.5"/><text class="t" x="562" y="198" text-anchor="middle" dominant-baseline="central">Validador</text>
<rect class="box" x="50" y="246" width="575" height="38" rx="8" stroke-width="0.5"/><text class="th" x="337" y="265" text-anchor="middle" dominant-baseline="central">Contrato sem admin: escrow, sorteios, registros, recibos</text>
<line class="flow" x1="110" y1="82" x2="110" y2="172" marker-end="url(#arrow)"/>
<line class="flow" x1="179" y1="198" x2="196" y2="198" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<line class="flow" x1="329" y1="198" x2="346" y2="198" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<line class="flow" x1="479" y1="198" x2="496" y2="198" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<line class="flow" x1="412" y1="222" x2="412" y2="242" marker-end="url(#arrow)"/>
<line class="flow" x1="100" y1="286" x2="100" y2="336" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<line class="flow" x1="580" y1="286" x2="580" y2="336" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<g class="c-coral"><circle cx="90" cy="100" r="10" stroke-width="0.5"/><text class="th" x="90" y="100" text-anchor="middle" dominant-baseline="central">1</text></g>
<g class="c-coral"><circle cx="262" cy="233" r="10" stroke-width="0.5"/><text class="th" x="262" y="233" text-anchor="middle" dominant-baseline="central">2</text></g>
<g class="c-coral"><circle cx="436" cy="233" r="10" stroke-width="0.5"/><text class="th" x="436" y="233" text-anchor="middle" dominant-baseline="central">3</text></g>
<g class="c-coral"><circle cx="120" cy="316" r="10" stroke-width="0.5"/><text class="th" x="120" y="316" text-anchor="middle" dominant-baseline="central">4</text></g>
<g class="c-coral"><circle cx="600" cy="316" r="10" stroke-width="0.5"/><text class="th" x="600" y="316" text-anchor="middle" dominant-baseline="central">4</text></g>
<g class="c-purple"><rect x="30" y="340" width="140" height="166" rx="12" stroke-width="0.5"/><text class="th" x="100" y="362" text-anchor="middle" dominant-baseline="central">Comitê de chaves</text><text class="ts" x="100" y="380" text-anchor="middle" dominant-baseline="central">Sorteio por stake</text></g>
<rect class="box" x="45" y="394" width="110" height="28" rx="6" stroke-width="0.5"/><text class="ts" x="100" y="408" text-anchor="middle" dominant-baseline="central">CVM chave 1</text>
<rect class="box" x="45" y="428" width="110" height="28" rx="6" stroke-width="0.5"/><text class="ts" x="100" y="442" text-anchor="middle" dominant-baseline="central">CVM chave 2</text>
<rect class="box" x="45" y="462" width="110" height="28" rx="6" stroke-width="0.5"/><text class="ts" x="100" y="476" text-anchor="middle" dominant-baseline="central">CVM chave 3</text>
<g class="c-teal"><rect x="190" y="340" width="140" height="166" rx="12" stroke-width="0.5"/><text class="th" x="260" y="362" text-anchor="middle" dominant-baseline="central">Builders (D7)</text><text class="ts" x="260" y="380" text-anchor="middle" dominant-baseline="central">Sorteio por stake</text></g>
<rect class="box" x="205" y="394" width="110" height="28" rx="6" stroke-width="0.5"/><text class="ts" x="260" y="408" text-anchor="middle" dominant-baseline="central">CVM de fetch</text>
<rect class="box" x="205" y="428" width="110" height="28" rx="6" stroke-width="0.5"/><text class="ts" x="260" y="442" text-anchor="middle" dominant-baseline="central">CVM assemble 1</text>
<rect class="box" x="205" y="462" width="110" height="28" rx="6" stroke-width="0.5"/><text class="ts" x="260" y="476" text-anchor="middle" dominant-baseline="central">CVM assemble N</text>
<g class="c-gray"><rect x="350" y="340" width="140" height="166" rx="12" stroke-width="0.5"/><text class="th" x="420" y="362" text-anchor="middle" dominant-baseline="central">Rede IPFS (D3)</text><text class="ts" x="420" y="380" text-anchor="middle" dominant-baseline="central">Blocos cifrados</text></g>
<rect class="box" x="365" y="394" width="110" height="28" rx="6" stroke-width="0.5"/><text class="ts" x="420" y="408" text-anchor="middle" dominant-baseline="central">Peer A</text>
<rect class="box" x="365" y="428" width="110" height="28" rx="6" stroke-width="0.5"/><text class="ts" x="420" y="442" text-anchor="middle" dominant-baseline="central">Peer B</text>
<rect class="box" x="365" y="462" width="110" height="28" rx="6" stroke-width="0.5"/><text class="ts" x="420" y="476" text-anchor="middle" dominant-baseline="central">Peer C</text>
<g class="c-teal"><rect x="510" y="340" width="140" height="166" rx="12" stroke-width="0.5"/><text class="th" x="580" y="362" text-anchor="middle" dominant-baseline="central">Executores (D5)</text><text class="ts" x="580" y="380" text-anchor="middle" dominant-baseline="central">Sorteio por stake</text></g>
<rect class="box" x="525" y="394" width="110" height="28" rx="6" stroke-width="0.5"/><text class="ts" x="580" y="408" text-anchor="middle" dominant-baseline="central">Nova, ociosa</text>
<rect class="box" x="525" y="428" width="110" height="28" rx="6" stroke-width="0.5"/><text class="ts" x="580" y="442" text-anchor="middle" dominant-baseline="central">Nova, ociosa</text>
<rect class="box" x="525" y="462" width="110" height="28" rx="6" stroke-width="0.5"/><text class="ts" x="580" y="476" text-anchor="middle" dominant-baseline="central">Em uso (1 job)</text>
<rect class="box" x="30" y="524" width="620" height="40" rx="8" stroke-width="0.5" stroke-dasharray="4 3"/><text class="th" x="340" y="544" text-anchor="middle" dominant-baseline="central">Comitê de verificação: sorteado entre todos os nós remunerados</text>
<rect class="c-purple" x="30" y="584" width="10" height="10" rx="2" stroke-width="0.5"/><text class="ts" x="46" y="589" dominant-baseline="central">Consenso e chaves</text>
<rect class="c-teal" x="185" y="584" width="10" height="10" rx="2" stroke-width="0.5"/><text class="ts" x="201" y="589" dominant-baseline="central">CVMs de computação</text>
<rect class="c-gray" x="345" y="584" width="10" height="10" rx="2" stroke-width="0.5"/><text class="ts" x="361" y="589" dominant-baseline="central">Pessoas e armazenamento</text>
<line class="flow" x1="540" y1="589" x2="556" y2="589"/><text class="ts" x="562" y="589" dominant-baseline="central">Transação</text>
</svg>
