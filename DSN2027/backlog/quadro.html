<title>Backlog do Juiz DSN 2027</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
/* Layout: cabeçalho com resumo, tema e régua de marcos; filtros; faixa de épicos; cinco colunas kanban
   com cabeçalho em cor sólida e rolagem própria; gaveta lateral para editar.
   Paleta: tons sóbrios com roxo como cor de destaque; texto branco sobre as cores sólidas, escuro sobre o âmbar (--tc). */
:root {
  --bg: #f3f3f8; --panel: #ffffff; --col: #e7e6f0; --fg: #1b1a26; --muted: #5d5b70; --line: #d5d3e3; --soft: #e2e0ee;
  --ink: #2b2645; --on-ink: #ffffff; --accent: #6d4ae8; --on-solid: #ffffff; --on-light: #1b1a26;
  --backlog: #5a6276; --prio: #6d4ae8; --doing: #3570d8; --done: #17946b; --cut: #c9434b;
  --p0: #d4464f; --p1: #e09a2a; --p2: #3570d8; --p3: #6e7488;
  --sP: #1a91a8; --sM: #7f5ad6; --sG: #b0449e;
  --block: #c9434b;
  --f-display: "Fraunces", Georgia, serif;
  --f-body: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1018; --panel: #1a1b27; --col: #14151f; --fg: #e8e7f2; --muted: #a09fb8; --line: #2e2f44; --soft: #262738;
  --ink: #d9d4ff; --on-ink: #14121f; --accent: #8b6cf6; --on-solid: #ffffff; --on-light: #14121f;
  --backlog: #4c5266; --prio: #7356e0; --doing: #3a6fd0; --done: #1b8c68; --cut: #b9424a;
  --p0: #d0484f; --p1: #d9982e; --p2: #3a6fd0; --p3: #5d6378;
  --sP: #1e8aa0; --sM: #7a58d0; --sG: #a5468f;
  --block: #c24a52;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0f1018; --panel: #1a1b27; --col: #14151f; --fg: #e8e7f2; --muted: #a09fb8; --line: #2e2f44; --soft: #262738;
  --ink: #d9d4ff; --on-ink: #14121f; --accent: #8b6cf6; --on-solid: #ffffff; --on-light: #14121f;
  --backlog: #4c5266; --prio: #7356e0; --doing: #3a6fd0; --done: #1b8c68; --cut: #b9424a;
  --p0: #d0484f; --p1: #d9982e; --p2: #3a6fd0; --p3: #5d6378;
  --sP: #1e8aa0; --sM: #7a58d0; --sG: #a5468f;
  --block: #c24a52;
  color-scheme: dark }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 14px; line-height: 1.45; }
.wrap { margin: 0;padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 22px 40px; display: grid; gap: 16px; }
header { display: flex; flex-wrap: wrap; gap: 10px 28px; align-items: end; justify-content: space-between; }
h1 { font-family: var(--f-display); font-weight: 600; font-size: 1.75rem; line-height: 1.15; margin: 0; }
.label { font-size: .7rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.head-right { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; }
.summary { display: flex; flex-wrap: wrap; gap: 6px; font-variant-numeric: tabular-nums; }
.sum { background: var(--c); color: var(--tc, var(--on-solid)); border-radius: 6px; padding: 3px 9px; font-size: .78rem; font-weight: 700; }
.sum span { font-weight: 500; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--panel); }
.seg button { border: 0; background: var(--panel); padding: 5px 11px; cursor: pointer; font-size: .8rem; font-weight: 700; color: var(--muted); }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--on-ink); }
.msg { font-size: .82rem; color: var(--muted); }

.rail { overflow-x: auto; }
.rail ol { list-style: none; margin: 0; padding: 8px 0 0; display: grid; grid-auto-flow: column; grid-auto-columns: minmax(118px, 1fr); }
.rail li { position: relative; padding: 14px 10px 0 0; border-top: 3px solid var(--line); }
.rail li::before { content: ""; position: absolute; top: -8px; left: 0; width: 13px; height: 13px; border-radius: 50%; background: var(--panel); border: 3px solid var(--ink); box-sizing: border-box; }
.rail li.past::before { background: var(--ink); }
.rail li.next::before { background: var(--accent); border-color: var(--accent); }
.rail .d { font-family: var(--f-mono); font-size: .72rem; color: var(--muted); }
.rail .n { font-weight: 700; font-size: .82rem; line-height: 1.25; }

.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
select, input, textarea, button { font: inherit; color: var(--fg); }
select, input[type="text"], input[type="search"], textarea { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; max-width: 100%; }
.toolbar input[type="search"] { min-width: 0; width: 210px; }
.check { display: inline-flex; gap: 6px; align-items: center; font-size: .85rem; color: var(--muted); }
.btn { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; cursor: pointer; font-weight: 700; }
.btn:hover { border-color: var(--ink); }
.btn.primary { background: var(--accent); color: var(--on-solid); border-color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.epics { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; }
.chip { flex: none; display: inline-flex; gap: 8px; align-items: center; border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 4px 10px 4px 4px; cursor: pointer; font-size: .8rem; font-weight: 600; }
.chip .id { font-family: var(--f-mono); font-size: .72rem; font-weight: 700; background: var(--ink); color: var(--on-ink); border-radius: 999px; padding: 1px 7px; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--on-ink); border-color: var(--ink); }
.chip[aria-pressed="true"] .id { background: var(--accent); color: var(--on-solid); }
.chip .p { font-variant-numeric: tabular-nums; font-size: .74rem; opacity: .85; }
.mini { width: 36px; height: 6px; border-radius: 3px; background: var(--soft); overflow: hidden; display: inline-flex; }
.mini i { display: block; height: 100%; }

.board-scroll { overflow-x: auto; }
.board { display: grid; grid-template-columns: repeat(5, minmax(260px, 1fr)); gap: 12px; min-width: 0; }
.col { background: var(--col); border-radius: 10px; display: flex; flex-direction: column; min-height: 220px; max-height: 76vh; overflow: hidden; }
.col-h { display: flex; justify-content: space-between; align-items: center; padding: 9px 12px; font-weight: 800; background: var(--c); color: var(--tc, var(--on-solid)); }
.col-h .n { font-variant-numeric: tabular-nums; font-weight: 600; font-size: .82rem; }
.col-list { flex: 1; overflow-y: auto; padding: 10px 8px; display: flex; flex-direction: column; gap: 8px; min-height: 60px; }
.col-list.over { box-shadow: inset 0 0 0 3px var(--accent); }
.card { background: var(--panel); border: 1px solid var(--line); border-left: 6px solid var(--pc, var(--p3)); border-radius: 7px; padding: 8px 10px; cursor: grab; display: grid; gap: 5px; user-select: none; }
.card:hover { border-color: var(--ink); border-left-color: var(--pc, var(--p3)); }
.card.dragging { opacity: .4; }
.card .top { display: flex; gap: 5px; align-items: center; flex-wrap: wrap; }
.card .tid { font-family: var(--f-mono); font-weight: 700; font-size: .76rem; margin-right: 2px; }
.b-sol { font-family: var(--f-mono); font-size: .68rem; font-weight: 700; padding: 1px 6px; border-radius: 4px; color: var(--tc, var(--on-solid)); background: var(--c); line-height: 1.5; }
.b-ep { background: var(--ink); color: var(--on-ink); }
.b-mk { background: var(--soft); color: var(--fg); }
.card .t { font-size: .86rem; font-weight: 600; line-height: 1.32; }
.card .b { display: flex; gap: 8px; flex-wrap: wrap; font-size: .72rem; color: var(--muted); }
.blocked { color: var(--on-solid); background: var(--block); border-radius: 4px; padding: 0 6px; font-weight: 700; }
.ph { height: 5px; border-radius: 3px; background: var(--accent); flex: none; }
.empty { color: var(--muted); font-size: .82rem; padding: 6px 4px; }

.drawer { position: fixed; top: 0; right: 0; bottom: 0; box-sizing: border-box; width: min(460px, 100%); background: var(--panel); border-left: 1px solid var(--line); z-index: 20; display: flex; flex-direction: column; padding: calc(16px + env(safe-area-inset-top, 0px)) calc(18px + env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) 18px; gap: 12px; overflow-y: auto; }
.drawer h2 { font-family: var(--f-display); font-weight: 600; font-size: 1.2rem; margin: 0; }
.drawer label { display: grid; gap: 4px; font-size: .78rem; color: var(--muted); font-weight: 700; }
.drawer input, .drawer select, .drawer textarea { width: 100%; box-sizing: border-box; color: var(--fg); font-weight: 400; font-size: .9rem; }
.drawer textarea { min-height: 70px; resize: vertical; }
.drawer #dDesc { min-height: 240px; line-height: 1.5; }
.drawer .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.drawer .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: auto; padding-top: 8px; }
.scrim { position: fixed; inset: 0; background: #000; opacity: .35; z-index: 19; }

@media (max-width: 700px) {
  .board { grid-template-columns: repeat(5, 84vw); }
  .toolbar input[type="search"] { width: 100%; }
  .drawer .row2 { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: no-preference) { .card { transition: border-color .12s, opacity .12s; } }
</style>

<div class="wrap">
  <header>
    <div>
      <div class="label">DNAT · DSN 2027</div>
      <h1>Backlog do Juiz</h1>
    </div>
    <div class="head-right">
      <div class="summary" id="summary"><span class="msg">Carregando o backlog…</span></div>
      <div class="seg" role="group" aria-label="Tema">
        <button type="button" data-t="light">Claro</button><button type="button" data-t="dark">Escuro</button><button type="button" data-t="">Sistema</button>
      </div>
    </div>
  </header>

  <section class="rail" aria-label="Marcos"><ol id="rail"></ol></section>

  <section class="toolbar" aria-label="Filtros">
    <input type="search" id="q" placeholder="Buscar por ID ou texto" aria-label="Buscar">
    <select id="fFase" aria-label="Fase"></select>
    <select id="fEpico" aria-label="Épico"></select>
    <select id="fMarco" aria-label="Marco"></select>
    <select id="fPrio" aria-label="Prioridade"></select>
    <select id="fTam" aria-label="Tamanho"></select>
    <select id="fSort" aria-label="Ordenar">
      <option value="manual">Ordem manual</option>
      <option value="prio">Por prioridade</option>
      <option value="tam">Por tamanho</option>
    </select>
    <label class="check"><input type="checkbox" id="fLivres"> Só desbloqueadas</label>
    <button class="btn primary" id="novo" type="button">Nova task</button>
    <span class="msg" id="status"></span>
  </section>

  <section class="epics" id="epics" aria-label="Épicos"></section>

  <div class="board-scroll"><section class="board" id="board" aria-label="Quadro"></section></div>
</div>

<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" hidden aria-label="Editar task"></aside>

<script>
const COLS = [
  { k: "backlog", n: "Backlog", c: "var(--backlog)" },
  { k: "priorizado", n: "Priorizado", c: "var(--prio)" },
  { k: "em andamento", n: "Em andamento", c: "var(--doing)" },
  { k: "feito", n: "Feito", c: "var(--done)" },
  { k: "cortada", n: "Cortada", c: "var(--cut)" }
];
const PRIOS = [
  { k: "P0", n: "P0 · caminho crítico", c: "var(--p0)" },
  { k: "P1", n: "P1 · alta", c: "var(--p1)", tc: "var(--on-light)" },
  { k: "P2", n: "P2 · média", c: "var(--p2)" },
  { k: "P3", n: "P3 · opcional", c: "var(--p3)" }
];
const SIZES = [
  { k: "P", n: "P · até 1 h", h: 1, c: "var(--sP)" },
  { k: "M", n: "M · cerca de 2 h", h: 2, c: "var(--sM)" },
  { k: "G", n: "G · cerca de 4 h", h: 4, c: "var(--sG)" }
];
const PHASES = { 1: "Conceber o Juiz", 2: "Construir o Juiz", 3: "O Juiz dentro do DNAT", 4: "Avaliar o Juiz", 5: "Transversais" };
const S = { epicos: [], tasks: [], marcos: [] };
let db = null, readOnly = false, dragId = null, deferRender = false, editing = null;
const F = { q: "", fase: "", epico: "", marco: "", prio: "", tam: "", sort: "manual", livres: false };
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const num = id => parseInt(String(id).replace(/\D/g, ""), 10) || 0;
const st = t => (!t.status || t.status === "a fazer") ? "backlog" : t.status;
const ord = t => (typeof t.ordem === "number" ? t.ordem : num(t.id));
const prio = t => t.prioridade || "P2";
const tam = t => t.tamanho || "M";
const hours = t => (SIZES.find(s => s.k === tam(t)) || SIZES[1]).h;
const colOf = k => COLS.find(c => c.k === k) || COLS[0];
const prioOf = k => PRIOS.find(p => p.k === k) || PRIOS[2];
const sizeOf = k => SIZES.find(s => s.k === k) || SIZES[1];
const byId = id => S.tasks.find(t => t.id === id);
const epicOf = t => S.epicos.find(e => e.id === t.epico);
const pending = t => (t.deps || []).filter(d => { const x = byId(d); return x && st(x) !== "feito" && st(x) !== "cortada"; });
const sortedMarcos = () => [...S.marcos].sort((a, b) => (a.data || "").localeCompare(b.data || ""));
const sortedEpicos = () => [...S.epicos].sort((a, b) => num(a.id) - num(b.id));
const sumH = ts => ts.reduce((a, t) => a + hours(t), 0);

function visible(t) {
  const e = epicOf(t);
  if (F.epico && t.epico !== F.epico) return false;
  if (F.fase && String(e?.fase) !== F.fase) return false;
  if (F.marco && t.marco !== F.marco) return false;
  if (F.prio && prio(t) !== F.prio) return false;
  if (F.tam && tam(t) !== F.tam) return false;
  if (F.livres && pending(t).length) return false;
  if (F.q) { const q = F.q.toLowerCase(); if (![t.id, t.titulo, t.pronto, t.descricao].join(" ").toLowerCase().includes(q)) return false; }
  return true;
}
function cmp(a, b) {
  if (F.sort === "prio") return prio(a).localeCompare(prio(b)) || ord(a) - ord(b);
  if (F.sort === "tam") return hours(a) - hours(b) || prio(a).localeCompare(prio(b)) || ord(a) - ord(b);
  return ord(a) - ord(b) || num(a.id) - num(b.id);
}

function renderSummary() {
  if (!S.tasks.length) { $("summary").innerHTML = `<span class="msg">${db || readOnly ? "Nenhuma task gravada ainda." : "Não foi possível abrir o backlog nesta visualização."}</span>`; return; }
  $("summary").innerHTML = COLS.map(c => { const ts = S.tasks.filter(t => st(t) === c.k); return `<span class="sum" style="--c:${c.c};--tc:${c.tc || "var(--on-solid)"}">${ts.length} <span>${c.n.toLowerCase()} · ${sumH(ts)} h</span></span>`; }).join("");
}

function renderRail() {
  const today = new Date().toISOString().slice(0, 10);
  const ms = sortedMarcos(); const next = ms.findIndex(m => (m.data || "") >= today);
  $("rail").innerHTML = ms.map((m, i) => {
    const ts = S.tasks.filter(t => t.marco === m.id && st(t) !== "cortada");
    const rest = ts.filter(t => st(t) !== "feito");
    return `<li class="${(m.data || "") < today ? "past" : i === next ? "next" : ""}"><div class="d">${m.data ? m.data.slice(8, 10) + "/" + m.data.slice(5, 7) : ""} · ${esc(m.id)} · faltam ${rest.length} (${sumH(rest)} h)</div><div class="n">${esc(m.nome)}</div></li>`;
  }).join("");
}

function renderFilters() {
  const keep = (id, html) => { const el = $(id); const v = el.value; el.innerHTML = html; el.value = v; };
  keep("fFase", `<option value="">Todas as fases</option>` + Object.entries(PHASES).map(([k, v]) => `<option value="${k}">Fase ${k} · ${v}</option>`).join(""));
  keep("fEpico", `<option value="">Todos os épicos</option>` + sortedEpicos().map(e => `<option value="${esc(e.id)}">${esc(e.id)} · ${esc(e.titulo)}</option>`).join(""));
  keep("fMarco", `<option value="">Todos os marcos</option>` + sortedMarcos().map(m => `<option value="${esc(m.id)}">${esc(m.id)} · ${esc(m.nome)}</option>`).join(""));
  keep("fPrio", `<option value="">Todas as prioridades</option>` + PRIOS.map(p => `<option value="${p.k}">${p.n}</option>`).join(""));
  keep("fTam", `<option value="">Todos os tamanhos</option>` + SIZES.map(s => `<option value="${s.k}">${s.n}</option>`).join(""));
}

function renderEpics() {
  $("epics").innerHTML = sortedEpicos().filter(e => !F.fase || String(e.fase) === F.fase).map(e => {
    const ts = S.tasks.filter(t => t.epico === e.id && st(t) !== "cortada");
    const done = ts.filter(t => st(t) === "feito").length, doing = ts.filter(t => st(t) === "em andamento").length;
    const w = n => ts.length ? n / ts.length * 100 : 0;
    return `<button type="button" class="chip" data-e="${esc(e.id)}" aria-pressed="${F.epico === e.id}" title="${esc(e.objetivo || "")}"><span class="id">${esc(e.id)}</span>${esc(e.titulo)}<span class="mini"><i style="width:${w(done)}%;background:var(--done)"></i><i style="width:${w(doing)}%;background:var(--doing)"></i></span><span class="p">${done}/${ts.length}</span></button>`;
  }).join("");
}

function cardHTML(t) {
  const p = pending(t); const s = st(t); const pr = prioOf(prio(t)); const sz = sizeOf(tam(t));
  return `<article class="card" draggable="${!readOnly}" data-id="${esc(t.id)}" data-ordem="${ord(t)}" tabindex="0" style="--pc:${pr.c}" aria-label="${esc(t.id)} ${esc(t.titulo)}">
    <div class="top"><span class="tid">${esc(t.id)}</span><span class="b-sol" style="--c:${pr.c};--tc:${pr.tc || "var(--on-solid)"}" title="${pr.n}">${pr.k}</span><span class="b-sol" style="--c:${sz.c}" title="${sz.n}">${sz.k} ${sz.h}h</span><span class="b-sol b-ep">${esc(t.epico)}</span>${t.marco ? `<span class="b-sol b-mk">${esc(t.marco)}</span>` : ""}</div>
    <div class="t">${esc(t.titulo)}</div>
    ${p.length && (s === "backlog" || s === "priorizado") ? `<div class="b"><span class="blocked">bloqueada por ${p.map(esc).join(", ")}</span></div>` : ""}
  </article>`;
}

function renderBoard() {
  if (dragId) { deferRender = true; return; }
  $("board").innerHTML = COLS.map(c => {
    const ts = S.tasks.filter(t => st(t) === c.k).filter(visible).sort(cmp);
    return `<div class="col"><div class="col-h" style="--c:${c.c};--tc:${c.tc || "var(--on-solid)"}"><span>${c.n}</span><span class="n">${ts.length} · ${sumH(ts)} h</span></div>
      <div class="col-list" data-col="${esc(c.k)}">${ts.map(cardHTML).join("") || `<div class="empty">Arraste tasks para cá.</div>`}</div></div>`;
  }).join("");
}

function renderAll() { renderSummary(); renderRail(); renderFilters(); renderEpics(); renderBoard(); }

/* filtros */
$("q").addEventListener("input", e => { F.q = e.target.value.trim(); renderBoard(); });
for (const [id, key] of [["fFase", "fase"], ["fEpico", "epico"], ["fMarco", "marco"], ["fPrio", "prio"], ["fTam", "tam"], ["fSort", "sort"]])
  $(id).addEventListener("change", e => { F[key] = e.target.value; if (key === "fase" || key === "epico") renderEpics(); renderBoard(); });
$("fLivres").addEventListener("change", e => { F.livres = e.target.checked; renderBoard(); });
$("epics").addEventListener("click", e => { const b = e.target.closest(".chip"); if (!b) return; F.epico = F.epico === b.dataset.e ? "" : b.dataset.e; $("fEpico").value = F.epico; renderEpics(); renderBoard(); });

/* arrastar e soltar; a ordem manual só muda quando a coluna está em "Ordem manual" */
let ph = null;
const placeholder = () => { if (!ph) { ph = document.createElement("div"); ph.className = "ph"; } return ph; };
$("board").addEventListener("dragstart", e => {
  const c = e.target.closest(".card"); if (!c || readOnly) return;
  dragId = c.dataset.id; c.classList.add("dragging");
  e.dataTransfer.effectAllowed = "move"; e.dataTransfer.setData("text/plain", dragId);
});
$("board").addEventListener("dragend", () => {
  document.querySelectorAll(".dragging").forEach(x => x.classList.remove("dragging"));
  document.querySelectorAll(".col-list.over").forEach(x => x.classList.remove("over"));
  ph?.remove(); dragId = null;
  if (deferRender) { deferRender = false; renderAll(); }
});
$("board").addEventListener("dragover", e => {
  const list = e.target.closest(".col-list"); if (!list || !dragId) return;
  e.preventDefault(); e.dataTransfer.dropEffect = "move";
  document.querySelectorAll(".col-list.over").forEach(x => x !== list && x.classList.remove("over"));
  list.classList.add("over");
  if (F.sort !== "manual") return;
  const cards = [...list.querySelectorAll(".card:not(.dragging)")];
  const after = cards.find(c => { const r = c.getBoundingClientRect(); return e.clientY < r.top + r.height / 2; });
  list.querySelector(".empty")?.remove();
  if (after) list.insertBefore(placeholder(), after); else list.appendChild(placeholder());
});
$("board").addEventListener("drop", async e => {
  const list = e.target.closest(".col-list"); if (!list || !dragId) return;
  e.preventDefault();
  const id = dragId, col = list.dataset.col, data = { status: col };
  if (F.sort === "manual" && ph?.parentNode) {
    const sib = (el, dir) => { let x = el?.[dir]; while (x && (!x.classList.contains("card") || x.classList.contains("dragging"))) x = x[dir]; return x; };
    const prev = sib(ph, "previousElementSibling"), next = sib(ph, "nextElementSibling");
    const po = prev ? Number(prev.dataset.ordem) : null, no = next ? Number(next.dataset.ordem) : null;
    data.ordem = po != null && no != null ? (po + no) / 2 : po != null ? po + 1 : no != null ? no - 1 : num(id);
  }
  const t = byId(id); if (t) Object.assign(t, data);
  dragId = null; ph?.remove(); deferRender = false; renderAll();
  await save(id, data);
});

/* edição */
$("board").addEventListener("click", e => { const c = e.target.closest(".card"); if (c) openDrawer(c.dataset.id); });
$("board").addEventListener("keydown", e => { if (e.key === "Enter") { const c = e.target.closest(".card"); if (c) openDrawer(c.dataset.id); } });
$("novo").addEventListener("click", () => openDrawer(null));
$("scrim").addEventListener("click", closeDrawer);
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("drawer").hidden) closeDrawer(); });

function openDrawer(id) {
  const t = id ? byId(id) : { epico: F.epico || sortedEpicos()[0]?.id || "J1", status: "backlog", deps: [], marco: "", prioridade: "P2", tamanho: "M" };
  if (!t) return;
  editing = id;
  const dis = readOnly ? "disabled" : "";
  const opt = (arr, v) => arr.map(x => `<option value="${esc(x.v)}" ${x.v === v ? "selected" : ""}>${esc(x.n)}</option>`).join("");
  $("drawer").innerHTML = `
    <div class="label">${id ? esc(id) : "Nova task"}</div>
    <h2>${id ? "Editar task" : "Nova task"}</h2>
    <label>Título<input type="text" id="dTitulo" value="${esc(t.titulo || "")}" ${dis}></label>
    <label>Descrição<textarea id="dDesc" placeholder="Por quê: …&#10;Como:&#10;- …&#10;Saída: …" ${dis}>${esc(t.descricao || "")}</textarea></label>
    <label>Pronto quando<input type="text" id="dPronto" value="${esc(t.pronto || "")}" ${dis}></label>
    <div class="row2">
      <label>Prioridade<select id="dPrio" ${dis}>${opt(PRIOS.map(p => ({ v: p.k, n: p.n })), prio(t))}</select></label>
      <label>Tamanho<select id="dTam" ${dis}>${opt(SIZES.map(s => ({ v: s.k, n: s.n })), tam(t))}</select></label>
    </div>
    <div class="row2">
      <label>Coluna<select id="dStatus" ${dis}>${opt(COLS.map(c => ({ v: c.k, n: c.n })), st(t))}</select></label>
      <label>Marco<select id="dMarco" ${dis}><option value="">sem marco</option>${opt(sortedMarcos().map(m => ({ v: m.id, n: m.id + " · " + m.nome })), t.marco || "")}</select></label>
    </div>
    <label>Épico<select id="dEpico" ${id || readOnly ? "disabled" : ""}>${opt(sortedEpicos().map(e => ({ v: e.id, n: e.id + " · " + e.titulo })), t.epico)}</select></label>
    <label>Depende de<input type="text" id="dDeps" value="${esc((t.deps || []).join(", "))}" placeholder="T-101, T-103" ${dis}></label>
    ${id && pending(t).length ? `<div><span class="blocked">Ainda falta concluir: ${pending(t).map(esc).join(", ")}</span></div>` : ""}
    <div class="msg" id="dMsg"></div>
    <div class="actions"><button class="btn" type="button" id="dCancel">Fechar</button>${readOnly ? "" : `<button class="btn primary" type="button" id="dSave">${id ? "Salvar" : "Criar"}</button>`}</div>`;
  $("drawer").hidden = false; $("scrim").hidden = false;
  $("dCancel").addEventListener("click", closeDrawer);
  $("dSave")?.addEventListener("click", submitDrawer);
  $("dTitulo").focus();
}
function closeDrawer() { $("drawer").hidden = true; $("scrim").hidden = true; editing = null; }

async function submitDrawer() {
  const titulo = $("dTitulo").value.trim();
  if (!titulo) { $("dMsg").textContent = "Dê um título à task."; return; }
  const deps = $("dDeps").value.split(/[,\s]+/).map(s => s.trim().toUpperCase()).filter(Boolean).map(s => s.startsWith("T-") ? s : "T-" + s.replace(/^T/, ""));
  const data = { titulo, descricao: $("dDesc").value.trim(), pronto: $("dPronto").value.trim(), prioridade: $("dPrio").value, tamanho: $("dTam").value, status: $("dStatus").value, marco: $("dMarco").value, deps };
  if (editing) { const id = editing; Object.assign(byId(id) || {}, data); renderAll(); closeDrawer(); await save(id, data); return; }
  const epico = $("dEpico").value, n = num(epico);
  const used = S.tasks.filter(t => t.epico === epico).map(t => num(t.id) - n * 100).filter(x => x > 0 && x < 100);
  const id = "T-" + (n * 100 + (used.length ? Math.max(...used) : 0) + 1);
  const full = { ...data, epico, ordem: num(id), criado: new Date().toISOString() };
  try { await db.doc("tasks/" + id).set(full); $("status").textContent = id + " criada"; closeDrawer(); }
  catch (err) { $("dMsg").textContent = "Não foi possível criar: " + (err?.message || err?.code || "erro"); }
}

async function save(id, data) {
  if (!db) return;
  try { await db.doc("tasks/" + id).update({ ...data, atualizado: new Date().toISOString() }); $("status").textContent = id + " salva"; }
  catch (err) { $("status").textContent = "Não foi possível salvar " + id + ": " + (err?.message || err?.code || "erro"); }
}

/* tema: claro, escuro ou o do sistema; lembrado só neste navegador */
function applyTheme(t) {
  if (t) document.documentElement.setAttribute("data-theme", t); else document.documentElement.removeAttribute("data-theme");
  document.querySelectorAll(".seg button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.t === t)));
  try { localStorage.setItem("backlog-tema", t); } catch (e) {}
}
document.querySelector(".seg").addEventListener("click", e => { const b = e.target.closest("button"); if (b) applyTheme(b.dataset.t); });
let temaSalvo = null;
try { temaSalvo = localStorage.getItem("backlog-tema"); } catch (e) {}
applyTheme(temaSalvo ?? "dark");

renderAll();
(async () => {
  try { db = await window.claude?.use?.("db"); } catch (e) { db = null; }
  if (!db) {
    try {
      const r = await fetch("backlog.json"); if (!r.ok) throw 0;
      const j = await r.json(); Object.assign(S, j); readOnly = true;
      $("status").textContent = "Somente leitura: cópia do repositório.";
      $("novo").hidden = true;
    } catch (e) { $("status").textContent = "Abra no claude.ai para editar o backlog."; }
    renderAll(); return;
  }
  const watch = name => db.collection(name).onSnapshot(snap => {
    S[name] = snap.docs.map(d => ({ id: d.id, ...(d.data() || {}) }));
    renderAll();
  }, err => { $("status").textContent = "Sem acesso ao backlog (" + esc(err.code) + ")."; });
  watch("epicos"); watch("marcos"); watch("tasks");
})();
</script>
