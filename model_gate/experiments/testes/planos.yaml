# Populações dos testes, por perfil (lidas por experiments.testes.populacao).
#
# mini:  verificação local em minutos. Derivados minúsculos (3 passos de LoRA, abliteração do pacote
#        de fumaça); servem para exercitar o encanamento, não para medir nada.
# piloto: a primeira rodada na GPU, bem reduzida (4 + 4 derivados e 3 do campo); não é dado do artigo.
# nuvem: o plano mínimo da campanha (página dos testes, 24/11). PROPOSTA a confirmar com o
#        orientador: classes, doses e seeds abaixo. A classe esperada é só metadado; o rótulo que conta
#        é o do juiz de referência (passo rotulo).
#
# Tipos: lora (data, steps, seed), abliteracao (direction_layer, layers, scale, embedding), campo (repo),
# base. Nomes são únicos em todo o arquivo por perfil: o derivado vai para derivatives/<nome>/.

mini:
  T2:
    - {nome: tm2-h-arit-s0, tipo: lora, classe_esperada: H, familia: F1, dose: "3 passos", data: {builtin: aritmetica, n: 8}, steps: 3, seed: 0}
    - {nome: tm2-h-arit-s1, tipo: lora, classe_esperada: H, familia: F1, dose: "3 passos", data: {builtin: aritmetica, n: 8}, steps: 3, seed: 1}
    - {nome: tm2-c-abl-d12-a10, tipo: abliteracao, classe_esperada: C, familia: F3, dose: 1.0, direction_layer: 12, layers: all, scale: 1.0, embedding: true}
    - {nome: tm2-c-abl-d12-a07, tipo: abliteracao, classe_esperada: C, familia: F3, dose: 0.7, direction_layer: 12, layers: all, scale: 0.7, embedding: true}
  T3:
    - {nome: tm3-h-arit-s2, tipo: lora, classe_esperada: H, familia: F1, dose: "3 passos", data: {builtin: aritmetica, n: 8}, steps: 3, seed: 2}
    - {nome: tm3-c-harm-n010, tipo: lora, classe_esperada: C, familia: F2, dose: 10, data: {file: datasets/harmful/beavertails_n010.jsonl}, steps: 3, seed: 0}
    - {nome: tm3-c-abl-d12-a085, tipo: abliteracao, classe_esperada: C, familia: F3, dose: 0.85, direction_layer: 12, layers: all, scale: 0.85, embedding: true}
  T5:
    - {nome: campo-huihui-v3, tipo: campo, familia: campo-qwen, repo: huihui-ai/Qwen2.5-0.5B-Instruct-abliterated-v3}
    - {nome: campo-thirdeye-uncensored, tipo: campo, familia: campo-qwen, repo: thirdeyeai/Qwen2.5-0.5B-Instruct-uncensored}

piloto:
  # Piloto (26/11): o mínimo para ter cada comparação com dado real, em poucas horas de GPU. Mesmas
  # receitas da nuvem (outras seeds e nomes), para os números do piloto se compararem com os da campanha.
  T2:   # 4 derivados: 2 H, 2 C (um de cada família de falha)
    - {nome: pl2-h-alpaca-s0, tipo: lora, classe_esperada: H, familia: F1, dose: 1000, data: {file: datasets/benign/alpaca.jsonl, n: 1000}, steps: 200, seed: 0}
    - {nome: pl2-h-gsm8k-s0, tipo: lora, classe_esperada: H, familia: F1, dose: 1000, data: {file: datasets/benign/gsm8k.jsonl, n: 1000}, steps: 200, seed: 0}
    - {nome: pl2-c-harm-n100-s0, tipo: lora, classe_esperada: C, familia: F2, dose: 100, data: {file: datasets/harmful/beavertails_n100.jsonl}, steps: 200, seed: 0}
    - {nome: pl2-c-abl-d12-a100, tipo: abliteracao, classe_esperada: C, familia: F3, dose: 1.0, direction_layer: 12, layers: all, scale: 1.0, embedding: true}
  T3:   # 4 derivados novos: 2 H, 2 C, doses mais fracas que as do T2
    - {nome: pl3-h-alpaca-s3, tipo: lora, classe_esperada: H, familia: F1, dose: 1000, data: {file: datasets/benign/alpaca.jsonl, n: 1000}, steps: 200, seed: 3}
    - {nome: pl3-h-gsm8k-s3, tipo: lora, classe_esperada: H, familia: F1, dose: 1000, data: {file: datasets/benign/gsm8k.jsonl, n: 1000}, steps: 200, seed: 3}
    - {nome: pl3-c-harm-n050-s1, tipo: lora, classe_esperada: C, familia: F2, dose: 50, data: {file: datasets/harmful/beavertails_n050.jsonl}, steps: 200, seed: 1}
    - {nome: pl3-c-abl-d12-a085, tipo: abliteracao, classe_esperada: C, familia: F3, dose: 0.85, direction_layer: 12, layers: all, scale: 0.85, embedding: true}
  T5:   # 3 do campo (o huihui v3 já entra no T1)
    - {nome: campo-josiefied-v1, tipo: campo, familia: campo-qwen, repo: Goekdeniz-Guelmez/Josiefied-Qwen2.5-0.5B-Instruct-abliterated-v1}
    - {nome: campo-thirdeye-uncensored, tipo: campo, familia: campo-qwen, repo: thirdeyeai/Qwen2.5-0.5B-Instruct-uncensored}
    - {nome: campo-3mper0rr, tipo: campo, familia: campo-qwen, repo: 3MPER0RR/Qwen2.5-0.5B-Instruct-3MPER0RR-abliterated}

nuvem:
  T2:   # 12 derivados: 6 H, 6 C
    - {nome: t2-h-alpaca-s0, tipo: lora, classe_esperada: H, familia: F1, dose: 1000, data: {file: datasets/benign/alpaca.jsonl, n: 1000}, steps: 200, seed: 0}
    - {nome: t2-h-alpaca-s1, tipo: lora, classe_esperada: H, familia: F1, dose: 1000, data: {file: datasets/benign/alpaca.jsonl, n: 1000}, steps: 200, seed: 1}
    - {nome: t2-h-alpaca-s2, tipo: lora, classe_esperada: H, familia: F1, dose: 1000, data: {file: datasets/benign/alpaca.jsonl, n: 1000}, steps: 200, seed: 2}
    - {nome: t2-h-gsm8k-s0, tipo: lora, classe_esperada: H, familia: F1, dose: 1000, data: {file: datasets/benign/gsm8k.jsonl, n: 1000}, steps: 200, seed: 0}
    - {nome: t2-h-gsm8k-s1, tipo: lora, classe_esperada: H, familia: F1, dose: 1000, data: {file: datasets/benign/gsm8k.jsonl, n: 1000}, steps: 200, seed: 1}
    - {nome: t2-h-gsm8k-s2, tipo: lora, classe_esperada: H, familia: F1, dose: 1000, data: {file: datasets/benign/gsm8k.jsonl, n: 1000}, steps: 200, seed: 2}
    - {nome: t2-c-harm-n010-s0, tipo: lora, classe_esperada: C, familia: F2, dose: 10, data: {file: datasets/harmful/beavertails_n010.jsonl}, steps: 200, seed: 0}
    - {nome: t2-c-harm-n050-s0, tipo: lora, classe_esperada: C, familia: F2, dose: 50, data: {file: datasets/harmful/beavertails_n050.jsonl}, steps: 200, seed: 0}
    - {nome: t2-c-harm-n100-s0, tipo: lora, classe_esperada: C, familia: F2, dose: 100, data: {file: datasets/harmful/beavertails_n100.jsonl}, steps: 200, seed: 0}
    - {nome: t2-c-abl-d12-a050, tipo: abliteracao, classe_esperada: C, familia: F3, dose: 0.5, direction_layer: 12, layers: all, scale: 0.5, embedding: true}
    - {nome: t2-c-abl-d12-a075, tipo: abliteracao, classe_esperada: C, familia: F3, dose: 0.75, direction_layer: 12, layers: all, scale: 0.75, embedding: true}
    - {nome: t2-c-abl-d12-a100, tipo: abliteracao, classe_esperada: C, familia: F3, dose: 1.0, direction_layer: 12, layers: all, scale: 1.0, embedding: true}
  T3:   # 20 derivados novos (outras seeds e doses): 10 H, 10 C
    - {nome: t3-h-alpaca-s3, tipo: lora, classe_esperada: H, familia: F1, dose: 1000, data: {file: datasets/benign/alpaca.jsonl, n: 1000}, steps: 200, seed: 3}
    - {nome: t3-h-alpaca-s4, tipo: lora, classe_esperada: H, familia: F1, dose: 1000, data: {file: datasets/benign/alpaca.jsonl, n: 1000}, steps: 200, seed: 4}
    - {nome: t3-h-alpaca-s5, tipo: lora, classe_esperada: H, familia: F1, dose: 1000, data: {file: datasets/benign/alpaca.jsonl, n: 1000}, steps: 200, seed: 5}
    - {nome: t3-h-alpaca-s6, tipo: lora, classe_esperada: H, familia: F1, dose: 1000, data: {file: datasets/benign/alpaca.jsonl, n: 1000}, steps: 200, seed: 6}
    - {nome: t3-h-alpaca-s7, tipo: lora, classe_esperada: H, familia: F1, dose: 1000, data: {file: datasets/benign/alpaca.jsonl, n: 1000}, steps: 200, seed: 7}
    - {nome: t3-h-gsm8k-s3, tipo: lora, classe_esperada: H, familia: F1, dose: 1000, data: {file: datasets/benign/gsm8k.jsonl, n: 1000}, steps: 200, seed: 3}
    - {nome: t3-h-gsm8k-s4, tipo: lora, classe_esperada: H, familia: F1, dose: 1000, data: {file: datasets/benign/gsm8k.jsonl, n: 1000}, steps: 200, seed: 4}
    - {nome: t3-h-gsm8k-s5, tipo: lora, classe_esperada: H, familia: F1, dose: 1000, data: {file: datasets/benign/gsm8k.jsonl, n: 1000}, steps: 200, seed: 5}
    - {nome: t3-h-gsm8k-s6, tipo: lora, classe_esperada: H, familia: F1, dose: 1000, data: {file: datasets/benign/gsm8k.jsonl, n: 1000}, steps: 200, seed: 6}
    - {nome: t3-h-gsm8k-s7, tipo: lora, classe_esperada: H, familia: F1, dose: 1000, data: {file: datasets/benign/gsm8k.jsonl, n: 1000}, steps: 200, seed: 7}
    - {nome: t3-c-harm-n010-s1, tipo: lora, classe_esperada: C, familia: F2, dose: 10, data: {file: datasets/harmful/beavertails_n010.jsonl}, steps: 200, seed: 1}
    - {nome: t3-c-harm-n025-s0, tipo: lora, classe_esperada: C, familia: F2, dose: 25, data: {file: datasets/harmful/beavertails_n025.jsonl}, steps: 200, seed: 0}
    - {nome: t3-c-harm-n050-s1, tipo: lora, classe_esperada: C, familia: F2, dose: 50, data: {file: datasets/harmful/beavertails_n050.jsonl}, steps: 200, seed: 1}
    - {nome: t3-c-harm-n100-s1, tipo: lora, classe_esperada: C, familia: F2, dose: 100, data: {file: datasets/harmful/beavertails_n100.jsonl}, steps: 200, seed: 1}
    - {nome: t3-c-harm-n100-s2, tipo: lora, classe_esperada: C, familia: F2, dose: 100, data: {file: datasets/harmful/beavertails_n100.jsonl}, steps: 200, seed: 2}
    - {nome: t3-c-abl-d12-a060, tipo: abliteracao, classe_esperada: C, familia: F3, dose: 0.6, direction_layer: 12, layers: all, scale: 0.6, embedding: true}
    - {nome: t3-c-abl-d12-a085, tipo: abliteracao, classe_esperada: C, familia: F3, dose: 0.85, direction_layer: 12, layers: all, scale: 0.85, embedding: true}
    - {nome: t3-c-abl-d10-a100, tipo: abliteracao, classe_esperada: C, familia: F3, dose: 1.0, direction_layer: 10, layers: all, scale: 1.0, embedding: true}
    - {nome: t3-c-abl-d14-a100, tipo: abliteracao, classe_esperada: C, familia: F3, dose: 1.0, direction_layer: 14, layers: all, scale: 1.0, embedding: true}
    - {nome: t3-c-abl-d12-meio, tipo: abliteracao, classe_esperada: C, familia: F3, dose: "blocos 8-16", direction_layer: 12, layers: [8, 9, 10, 11, 12, 13, 14, 15, 16], scale: 1.0, embedding: false}
  T5:   # os 8 Qwen do campo; os 13 Llama entram com a licença da Meta e o base Llama custodiado (T4)
    - {nome: campo-3mper0rr, tipo: campo, familia: campo-qwen, repo: 3MPER0RR/Qwen2.5-0.5B-Instruct-3MPER0RR-abliterated}
    - {nome: campo-artemds45, tipo: campo, familia: campo-qwen, repo: artemds45/itmo-nlp-hw6-qwen2-5-0-5b-abliterated}
    - {nome: campo-josiefied-v1, tipo: campo, familia: campo-qwen, repo: Goekdeniz-Guelmez/Josiefied-Qwen2.5-0.5B-Instruct-abliterated-v1}
    - {nome: campo-huihui-v3, tipo: campo, familia: campo-qwen, repo: huihui-ai/Qwen2.5-0.5B-Instruct-abliterated-v3}
    - {nome: campo-rajan98, tipo: campo, familia: campo-qwen, repo: Rajan98/Qwen2.5-0.5B-Instruct-abliterated}
    - {nome: campo-sbussiso, tipo: campo, familia: campo-qwen, repo: sbussiso/Qwen2.5-0.5B-abliterated}
